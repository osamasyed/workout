<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exercise library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1013}
a{color:#C8F05A}a:hover{color:#E2FF8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0E1013; color: #F2F4F7; font-family: Inter, system-ui, sans-serif; box-sizing: border-box">
  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">Library</h1>

    <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; border-radius: 14px; background: #171A1F; border: 1px solid #2A2F37; color: #9AA3AF">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search exercises</span>
      <input type="search" placeholder="Search exercises or muscles" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: #F2F4F7; font: inherit; font-size: 15px">
    </label>

    <div role="group" aria-label="Filter by day" style="display: flex; gap: 8px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>

    <span style="font-size: 13px; color: #9AA3AF">{{count}} dumbbell exercises</span>
  </div>

  <ul style="list-style: none; margin: 8px 0 0; padding: 0 20px 24px; height: 540px; overflow-y: auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
      <li>
        <a href="Exercise.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 60px; box-sizing: border-box; border-radius: 14px; background: #171A1F; border: 1px solid #23272E; text-decoration: none; color: #F2F4F7">
          <span style="{{it.badge}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"></path></svg>
          </span>
          <span style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
            <span style="font-size: 15px; font-weight: 500">{{it.name}}</span>
            <span style="font-size: 12px; color: #9AA3AF">{{it.muscle}}</span>
          </span>
          <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: {{it.color}}">{{it.day}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7380" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        </a>
      </li>
    </sc-for>
  </ul>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #12151A; border-top: 1px solid #23272E; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 44px; text-decoration: none; color: #9AA3AF; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Today</a>
    <a href="Library.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 44px; text-decoration: none; color: #C8F05A; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"></path></svg>Library</a>
    <a href="Progress.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 72px; min-height: 44px; text-decoration: none; color: #9AA3AF; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18M5 16l4-5 4 3 6-8"></path></svg>Progress</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'All' };
  }
  renderVals() {
    var self = this;
    var colors = { Push: '#FF9A4D', Pull: '#5AB0FF', Legs: '#B79CFF' };
    var tints = { Push: '#2B2118', Pull: '#16232F', Legs: '#221D2E' };
    var all = [
      ['Push', 'Flat DB Bench Press', 'Chest · Triceps'],
      ['Push', 'Incline DB Press', 'Upper chest · Front delts'],
      ['Push', 'DB Floor Press', 'Chest · Triceps'],
      ['Push', 'DB Chest Fly', 'Chest'],
      ['Push', 'Seated DB Shoulder Press', 'Shoulders · Triceps'],
      ['Push', 'Arnold Press', 'Shoulders'],
      ['Push', 'DB Lateral Raise', 'Side delts'],
      ['Push', 'Overhead DB Triceps Ext.', 'Triceps'],
      ['Push', 'DB Skull Crusher', 'Triceps'],
      ['Pull', 'One-Arm DB Row', 'Lats · Mid back'],
      ['Pull', 'Chest-Supported DB Row', 'Upper back'],
      ['Pull', 'DB Pullover', 'Lats · Chest'],
      ['Pull', 'Rear Delt Fly', 'Rear delts'],
      ['Pull', 'DB Shrug', 'Traps'],
      ['Pull', 'DB Biceps Curl', 'Biceps'],
      ['Pull', 'Hammer Curl', 'Biceps · Forearms'],
      ['Pull', 'Incline DB Curl', 'Biceps (long head)'],
      ['Legs', 'Goblet Squat', 'Quads · Glutes'],
      ['Legs', 'DB Romanian Deadlift', 'Hamstrings · Glutes'],
      ['Legs', 'Bulgarian Split Squat', 'Quads · Glutes'],
      ['Legs', 'DB Walking Lunge', 'Quads · Glutes'],
      ['Legs', 'DB Step-Up', 'Quads · Glutes'],
      ['Legs', 'DB Hip Thrust', 'Glutes'],
      ['Legs', 'DB Sumo Squat', 'Adductors · Glutes'],
      ['Legs', 'Single-Leg Calf Raise', 'Calves']
    ];
    var f = this.state.filter;
    var items = all.filter(function (e) { return f === 'All' || e[0] === f; }).map(function (e) {
      return {
        day: e[0], name: e[1], muscle: e[2], color: colors[e[0]],
        badge: 'width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:' + tints[e[0]] + ';color:' + colors[e[0]]
      };
    });
    var chips = ['All', 'Push', 'Pull', 'Legs'].map(function (l) {
      var on = l === f;
      var c = l === 'All' ? '#C8F05A' : colors[l];
      return {
        label: l, on: on ? 'true' : 'false',
        pick: function () { self.setState({ filter: l }); },
        style: 'height:44px;padding:0 18px;border-radius:22px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;' +
          (on ? 'background:' + c + ';color:#0E1013;border:1px solid ' + c : 'background:#171A1F;color:#F2F4F7;border:1px solid #2A2F37')
      };
    });
    return { chips: chips, items: items, count: items.length };
  }
}
</script>
</body>
</html>
